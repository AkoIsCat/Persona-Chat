
services:
  db:
    image: pgvector/pgvector:pg17
    container_name: personachat-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: personachat
      POSTGRES_USER: persona
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U persona -d personachat"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
